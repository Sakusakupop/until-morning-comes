name: Check Unity asset metadata

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unity-meta:
    name: Unity asset .meta check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Unity asset metadata pairs
        run: python3 .github/scripts/check-unity-meta.py
